name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # unit + the IceBase emulator (no Java)
      - run: npm test
      # the same conformance suites on Firebase's emulators
      - run: npm run test:firebase
      - run: npm run test:functions
      - run: deno publish --dry-run
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dart-lang/setup-dart@v1
      # the Dart tests start the IceBase emulator from this repository
      - run: npm ci && npm run build
      - working-directory: packages/dart/icebase
        run: dart pub get && dart format --set-exit-if-changed lib test && dart analyze --fatal-infos && dart test
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - working-directory: packages/dart/icebase_flutter
        run: flutter pub get && flutter analyze --fatal-infos && flutter test
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Deno resolves npm packages from node_modules when the repository has a package.json.
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno publish
