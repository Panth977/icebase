name: icebase_flutter
description: Firebase mode for the IceBase Dart SDK on Flutter — the IceBase API over FlutterFire (Firestore, Auth, Realtime Database, Storage, Functions).
version: 0.1.0
repository: https://github.com/Panth977/icebase
license: Apache-2.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  icebase: ^0.1.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_database: ^13.0.1
  firebase_storage: ^14.0.1
  cloud_functions: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
